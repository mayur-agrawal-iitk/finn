# The whole backend, on a schedule, for free:
#  * every 30 min on trading days (08:30–16:30 IST): poll NSE's announcement feed + EOD prices -> redeploy
#  * every evening (17:45 IST): full rebuild incl. research dossiers, commit the snapshot, redeploy
# Model steps run only for documents never seen before (content-addressed cache in data/llm_cache).
name: refresh

on:
  schedule:
    - cron: "*/30 3-10 * * 1-5"
    - cron: "15 12 * * *"
  push:
    branches: [main]
    paths: ["web/**", "finn/**", "prompts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: finn-${{ github.run_id }}
          restore-keys: finn-
      - name: Tests
        run: python -m pytest -q tests
      - name: Refresh data
        id: refresh
        continue-on-error: true   # a source hiccup must never take the site down: we redeploy the last good snapshot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 12 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m finn build
          else
            python -m finn push
          fi
      - name: Commit snapshot (evening build only)
        if: steps.refresh.outcome == 'success' && (github.event.schedule == '15 12 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add web/data data/llm_cache data/rss_log.json
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
